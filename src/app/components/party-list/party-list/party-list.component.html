<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Party Management</h2>
    <button class="btn btn-success" routerLink="/parties/new">
      <i class="fas fa-plus me-1"></i> Add New Party
    </button>
  </div>
  <div class="card">
    <div class="card-header bg-light">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h5 class="mb-0">Party List</h5>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="Search parties..."
                   [(ngModel)]="searchTerm" (input)="onSearch()">
            <button class="btn btn-outline-secondary" type="button" (click)="onSearch()">
              <i class="fas fa-search"></i> Search
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Company</th>
              <th>Mobile</th>
              <th>GST Type</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Loader row -->
            <tr *ngIf="isLoading">
              <td colspan="6" class="text-center py-4">
                <app-loader></app-loader>
              </td>
            </tr>
            <!-- No data row -->

            <!-- Party rows -->
            <ng-container *ngIf="!isLoading && parties.length > 0">
              <tr *ngFor="let party of parties">
                <td>{{ party.name || 'N/A' }}</td>
                <td>{{ party.company_name || 'N/A' }}</td>
                <td>{{ party.mobile_no || 'N/A' }}</td>
                <td>{{ party.gst_type || 'N/A' }}</td>
                <td>
                  <span class="badge" [ngClass]="party.is_active ? 'bg-success' : 'bg-danger'">
                    {{ party.is_active ? 'Active' : 'Inactive' }}
                  </span>
                </td>
                <td>
                  <div class="btn-group" role="group">
                    <button class="btn btn-info btn-sm" [routerLink]="['/parties', party.id]">
                      <i class="fas fa-eye"></i>
                    </button>
                    <button class="btn btn-warning btn-sm" [routerLink]="['/parties', party.id, 'edit']">
                      <i class="fas fa-edit"></i> Edit
                    </button>
                    <button class="btn btn-danger btn-sm" *ngIf="party.id !== undefined" (click)="deleteParty(party.id)">
                      <i class="fas fa-trash"></i> Delete
                    </button>
                  </div>
                </td>
              </tr>
            </ng-container>
          </tbody>
          <tr *ngIf="!isLoading && parties?.length === 0">
            <td colspan="6" class="text-center py-4">
              <app-no-data></app-no-data>
            </td>
        </table>

      </div>

      <nav *ngIf="totalPages > 1" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <a class="page-link" (click)="onPageChange(currentPage - 1)">Previous</a>
          </li>
          <li *ngFor="let page of [].constructor(totalPages); let i = index"
              class="page-item" [class.active]="currentPage === i + 1">
            <a class="page-link" (click)="onPageChange(i + 1)">{{ i + 1 }}</a>
          </li>
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <a class="page-link" (click)="onPageChange(currentPage + 1)">Next</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
